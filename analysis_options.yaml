include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Une dépendance non déclarée ou un import inutilisé doit casser la CI.
    depend_on_referenced_packages: error
    unused_import: error
    unused_local_variable: error
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - unawaited_futures
    - use_super_parameters
